# Diagnostic: which write operations does this repository's workflow token have? (Stage 0 publishing check)
name: diag

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag.yml']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Token checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "actor=$GITHUB_ACTOR triggering=$GITHUB_TRIGGERING_ACTOR event=$GITHUB_EVENT_NAME"
          gh api "repos/$GITHUB_REPOSITORY" --jq '{visibility, permissions}' ; echo "repo read exit $?"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/diag-run-$GITHUB_RUN_NUMBER" -f sha="$GITHUB_SHA" --jq .ref; echo "create tag exit $?"
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="diag-run-$GITHUB_RUN_NUMBER" -f name="diag $GITHUB_RUN_NUMBER" -F prerelease=true --jq .html_url; echo "create release exit $?"
          git config user.name "stage0-ci"; git config user.email "stage0-ci@users.noreply.github.com"
          git checkout -q --orphan "ci-diag-$GITHUB_RUN_NUMBER"; git rm -rq --cached . ; echo hi > diag.txt; git add diag.txt; git commit -qm diag
          git push -q origin "ci-diag-$GITHUB_RUN_NUMBER"; echo "push branch exit $?"
