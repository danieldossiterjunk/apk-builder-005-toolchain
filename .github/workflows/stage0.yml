# APK Builder 005, Stage 0 feasibility: fetch every input from its official source, build AAPT2 from AOSP,
# build and verify the Android 17 framework resource table, generate API 37 stubs, resolve and census the
# AndroidX/Compose library set, and publish everything with SHA-256 sums as a GitHub release.
# Owner approvals: D-00 (downloads), D-03 option A (AAPT2 from AOSP via GitHub Actions), D-04 option A
# (framework table from pinned AOSP source). Nothing produced here ships in APK Builder without a later approval.
name: stage0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/stage0.yml', 'scripts/**', 'pins/**', 'tools/**', 'samples/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage0
  cancel-in-progress: false

env:
  AOSP_TAG: android-17.0.0_r1
  RECIPE_REPO: https://github.com/lzhiyong/android-sdk-tools
  RECIPE_COMMIT: fe637bf075f1b734b4b01d281f9f58899245ed92
  NDK_VERSION: 29.0.14206865
  PYTHONDONTWRITEBYTECODE: '1'
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  maven:
    name: Library closure (Google Maven, Maven Central)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve, download, verify and census
        run: |
          mkdir -p out
          python3 -I scripts/maven_closure.py pins/maven-roots.txt out/maven 2>&1 | tee out/maven-log.txt
      - name: Add licence text
        run: cp licenses/Apache-2.0.txt out/maven/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maven
          path: out
          if-no-files-found: warn

  aapt2:
    name: AAPT2 from AOSP ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        tag: [android-17.0.0_r1, platform-tools-36.0.0, platform-tools-35.0.2]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$ANDROID_HOME/ndk" || true
          df -h /
      - name: Build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build bison flex patch clang lld
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install the NDK from Google's SDK repository
        run: |
          mkdir -p out
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > out/sdkmanager-licences.txt 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > out/sdkmanager-ndk.txt 2>&1
          echo "NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          cat "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" | tee out/ndk-source.properties
      - name: Fetch the build recipe at its pinned commit
        run: |
          git init -q recipe
          git -C recipe fetch -q --depth 1 "$RECIPE_REPO" "$RECIPE_COMMIT"
          git -C recipe checkout -q FETCH_HEAD
          test "$(git -C recipe rev-parse HEAD)" = "$RECIPE_COMMIT"
      - name: Fetch AOSP sources at ${{ matrix.tag }} (android.googlesource.com)
        working-directory: recipe
        run: python3 -I get_source.py --tags "${{ matrix.tag }}" --jobs 8 2>&1 | tee ../out/get-source.txt
      - name: Record every source commit
        run: |
          for d in recipe/src/*/; do
            printf '%s %s %s\n' "$(basename "$d")" "$(git -C "$d" rev-parse HEAD 2>/dev/null || echo n/a)" "$(git -C "$d" config --get remote.origin.url 2>/dev/null || echo n/a)"
          done | tee out/source-commits.txt
      - name: Build AAPT2 for the Linux desktop (x86_64, used for the framework table and tests)
        id: host
        continue-on-error: true
        working-directory: recipe
        run: python3 -I build.py --toolchain host --arch x86_64 --link shared --cc clang --cxx clang++ --target aapt2 --output-dir ../out/host 2>&1 | tee ../out/build-host.txt
      - name: Build AAPT2 for Android ARM64 (NDK, static)
        id: android
        continue-on-error: true
        working-directory: recipe
        env:
          # a link map shows which static archive members end up in the binary (licence check);
          # passed through LDFLAGS so the NDK toolchain's own linker flags stay in place
          LDFLAGS: -Wl,-Map=aapt2-link.map
        run: python3 -I build.py --toolchain ndk --ndk "$NDK" --arch aarch64 --api 30 --target aapt2 --output-dir ../out/android 2>&1 | tee ../out/build-android.txt
      - name: Collect, identify and check the binaries
        if: always()
        run: |
          set +e
          mkdir -p dist
          for z in out/host/*.zip out/android/*.zip; do [ -f "$z" ] && unzip -o -q "$z" -d "dist/$(basename "$(dirname "$z")")"; done
          H=$(find dist/host -type f -name aapt2 2>/dev/null | head -1)
          A=$(find dist/android -type f -name aapt2 2>/dev/null | head -1)
          [ -n "$H" ] && cp "$H" out/aapt2-linux-x86_64 && chmod +x out/aapt2-linux-x86_64 && out/aapt2-linux-x86_64 version | tee out/aapt2-linux-x86_64.version
          [ -n "$A" ] && cp "$A" out/aapt2-android-arm64
          find recipe/build -name aapt2-link.map -exec cp {} out/aapt2-android-arm64.link.map \; 2>/dev/null
          RE="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          [ -f out/aapt2-android-arm64 ] && { file out/aapt2-android-arm64; "$RE" -h -l -d out/aapt2-android-arm64; } > out/aapt2-android-arm64.readelf.txt 2>&1
          [ -f out/aapt2-android-arm64.link.map ] && grep -oE '/lib(sepol|selinux|crypto|ssl|pcre2-8|packagelistparser)[^ (]*\.a\([^)]*\)' out/aapt2-android-arm64.link.map | sort | uniq -c > out/aapt2-android-arm64.linked-members.txt
          ( cd out && sha256sum aapt2-* 2>/dev/null ) | tee out/aapt2-SHA256SUMS.txt
          rm -rf out/host out/android
          echo "host=${{ steps.host.outcome }} android=${{ steps.android.outcome }}" | tee out/build-outcome.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aapt2-${{ matrix.tag }}
          path: out
          if-no-files-found: warn

  framework:
    name: Framework resource table (AOSP core/res)
    needs: aapt2
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: aapt2-*
          path: aapt2s
      - name: Choose the host AAPT2 (same tag as the framework if it built)
        run: |
          for t in android-17.0.0_r1 platform-tools-36.0.0 platform-tools-35.0.2; do
            f="aapt2s/aapt2-$t/aapt2-linux-x86_64"
            if [ -f "$f" ]; then chmod +x "$f"; echo "AAPT2=$PWD/$f" >> "$GITHUB_ENV"; echo "AAPT2_TAG=$t" >> "$GITHUB_ENV"; echo "using $f"; break; fi
          done
      - name: Fetch frameworks/base core/res at ${{ env.AOSP_TAG }} (partial clone)
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout --branch "$AOSP_TAG" https://android.googlesource.com/platform/frameworks/base fwb
          git -C fwb sparse-checkout set --no-cone /core/res/ /NOTICE /MODULE_LICENSE_APACHE2
          git -C fwb checkout -q
          git -C fwb rev-parse HEAD | tee fwb-commit.txt
      - name: SDK platform android.jar for comparison only (never published)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          P=$("$SDKM" --list 2>/dev/null | grep -oE 'platforms;android-37[^ |]*' | sort -u | tail -1)
          echo "comparison platform: $P"
          if [ -n "$P" ]; then "$SDKM" --install "$P" > /dev/null 2>&1; J="$ANDROID_HOME/platforms/${P#platforms;}/android.jar"; [ -f "$J" ] && echo "COMPARE_JAR=$J" >> "$GITHUB_ENV"; echo "COMPARE_PLATFORM=$P" >> "$GITHUB_ENV"; fi
      - name: Build, verify and smoke-test the table
        run: |
          mkdir -p out/framework
          cp fwb-commit.txt out/framework/
          echo "aapt2 tag: $AAPT2_TAG; comparison platform: ${COMPARE_PLATFORM:-none}" | tee out/framework/inputs.txt
          python3 -I scripts/framework_table.py --aapt2 "$AAPT2" --core-res fwb/core/res --tag "$AOSP_TAG" \
            --sample samples/res-smoke --out out/framework ${COMPARE_JAR:+--compare-jar "$COMPARE_JAR"} 2>&1 | tail -80
          cp fwb/NOTICE out/framework/AOSP-frameworks-base-NOTICE.txt 2>/dev/null || true
          rm -f out/framework/framework-compiled.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework
          path: out
          if-no-files-found: warn

  arm64-smoke:
    name: ARM64 AAPT2 smoke test on an ARM64 Linux runner
    needs: [aapt2, framework]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Run the Android ARM64 builds (static bionic executables) on Linux ARM64
        run: |
          set +e
          mkdir -p out
          T=art/framework/framework/android-framework-table.apk
          for d in art/aapt2-*; do
            tag=${d#art/aapt2-}; A="$d/aapt2-android-arm64"; [ -f "$A" ] || continue
            chmod +x "$A"; o="out/$tag"; mkdir -p "$o"
            { echo "== $tag"; uname -a; "$A" version; echo "exit $?"; } > "$o/run.txt" 2>&1
            if [ -f "$T" ]; then
              "$A" compile --dir samples/res-smoke/res -o "$o/compiled.zip" >> "$o/run.txt" 2>&1
              "$A" link -o "$o/smoke.apk" -I "$T" --manifest samples/res-smoke/AndroidManifest.xml --min-sdk-version 26 --target-sdk-version 36 \
                --version-code 1 --version-name 1.0 --java "$o/java" --output-text-symbols "$o/R.txt" --no-version-vectors "$o/compiled.zip" >> "$o/run.txt" 2>&1
              echo "link exit $?" >> "$o/run.txt"
              [ -f "$o/smoke.apk" ] && unzip -p "$o/smoke.apk" resources.arsc | sha256sum | tee "$o/resources.arsc.sha256"
            fi
            cat "$o/run.txt"
          done
          [ -f art/framework/framework/smoke/stripped/smoke.apk ] && unzip -p art/framework/framework/smoke/stripped/smoke.apk resources.arsc | sha256sum | tee out/host-resources.arsc.sha256
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-smoke
          path: out
          if-no-files-found: warn

  stubs:
    name: API 37 stubs from AOSP signature files
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: SDK platform android.jar for comparison only (never published)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          P=$("$SDKM" --list 2>/dev/null | grep -oE 'platforms;android-37[^ |]*' | sort -u | tail -1)
          echo "comparison platform: $P"
          if [ -n "$P" ]; then "$SDKM" --install "$P" > /dev/null 2>&1; J="$ANDROID_HOME/platforms/${P#platforms;}/android.jar"; [ -f "$J" ] && echo "COMPARE_JAR=$J" >> "$GITHUB_ENV"; fi
      - name: Collect the public API signature files
        run: |
          mkdir -p out/stubs
          python3 -I scripts/api_stubs.py collect --tag "$AOSP_TAG" --out out/stubs ${COMPARE_JAR:+--compare-jar "$COMPARE_JAR"} 2>&1 | tee out/stubs/collect-log.txt
      - name: ASM from Maven Central (for StubGen)
        run: |
          MD=$(curl -fsSL https://repo1.maven.org/maven2/org/ow2/asm/asm/maven-metadata.xml)
          V=$(echo "$MD" | grep -oE '<version>9\.[0-9]+(\.[0-9]+)?</version>' | sed -E 's/<\/?version>//g' | sort -V | tail -1)
          curl -fsSL -o asm.jar "https://repo1.maven.org/maven2/org/ow2/asm/asm/$V/asm-$V.jar"
          curl -fsSL -o asm.jar.sha1 "https://repo1.maven.org/maven2/org/ow2/asm/asm/$V/asm-$V.jar.sha1"
          echo "$(cut -c1-40 asm.jar.sha1)  asm.jar" | sha1sum -c -
          echo "asm $V $(sha256sum asm.jar | cut -c1-64)" | tee out/stubs/asm.txt
      - name: Generate the stubs with StubGen (from APK Builder 004)
        continue-on-error: true
        run: |
          javac -nowarn -cp asm.jar -d stubgen tools/StubGen.java
          java -cp stubgen:asm.jar StubGen out/stubs/android-api-current.txt out/stubs/classes > out/stubs/stubgen-log.txt 2>&1
          tail -40 out/stubs/stubgen-log.txt
          python3 -I tools/detjar.py out/stubs/classes out/stubs/android-37-stubs.jar
          sha256sum out/stubs/android-37-stubs.jar | tee out/stubs/android-37-stubs.jar.sha256
      - name: Compare the stubs with the SDK android.jar (comparison only)
        continue-on-error: true
        run: |
          [ -n "$COMPARE_JAR" ] && python3 -I scripts/api_stubs.py compare --stubs out/stubs/android-37-stubs.jar --compare-jar "$COMPARE_JAR" --out out/stubs/compare-sdk.json
      - name: Tidy
        if: always()
        run: rm -rf out/stubs/_src out/stubs/classes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stubs
          path: out
          if-no-files-found: warn

  publish:
    name: Publish results as a release
    needs: [maven, aapt2, framework, arm64-smoke, stubs]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Package, hash and record provenance
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          mkdir -p rel
          for d in art/*/; do n=$(basename "$d"); (cd "$d" && zip -q -r -X "../../rel/stage0-$n.zip" .); done
          python3 -I - <<'PY'
          import json, os, hashlib, platform
          prov = {"repository": os.environ["GITHUB_REPOSITORY"], "commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_number": os.environ["GITHUB_RUN_NUMBER"], "aosp_tag": os.environ["AOSP_TAG"], "recipe_repo": os.environ["RECIPE_REPO"],
                  "recipe_commit": os.environ["RECIPE_COMMIT"], "ndk_version": os.environ["NDK_VERSION"],
                  "job_results": {k: v.get("result") for k, v in json.loads(os.environ["RESULTS"]).items()},
                  "runner_image": os.environ.get("ImageOS", "") + " " + os.environ.get("ImageVersion", "")}
          open("rel/PROVENANCE.json", "w").write(json.dumps(prov, indent=1, sort_keys=True) + "\n")
          print(json.dumps(prov, indent=1, sort_keys=True))
          PY
          (cd rel && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "stage0-run-${GITHUB_RUN_NUMBER}" rel/* --prerelease --target "$GITHUB_SHA" \
            --title "Stage 0 run ${GITHUB_RUN_NUMBER}" \
            --notes "APK Builder 005 Stage 0 feasibility outputs (desktop/CI evidence only, nothing phone-tested). Inputs and job results: PROVENANCE.json. Third-party components keep their own licences (AOSP and AndroidX: Apache-2.0; see the files in each ZIP)."
